name: Build Mesa Virtio Venus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: ubuntu:26.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build
        working-directory: packges/mesa-virtio-venus
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Mesa package
        uses: actions/upload-artifact@v4
        with:
          name: mesa-virtio-venus
          path: packges/mesa-virtio-venus/workdir/mesa/outputs.zip
          if-no-files-found: error
